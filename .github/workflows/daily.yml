name: Daily Odds Bot

on:
  schedule:
    - cron: '0 6 * * *'  # Jeden Tag um 06:00 UTC (08:00 Uhr deutsche Zeit)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bibliothek installieren
        run: pip install requests

      - name: Bot ausführen
        run: python bot.py
